<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Portfolio of a Software Developer building modern web applications, AI-augmented software solutions, and security-conscious systems.">
  <title>Developer &amp; AI Software Engineer | Portfolio</title>

  <!-- Preconnect Google Fonts for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
    rel="stylesheet">

  <!-- Always start in Light Mode when opening the website -->
  <script>
    (function () {
      try {
        localStorage.removeItem('portfolio-theme');
        const sessionTheme = sessionStorage.getItem('portfolio-theme');
        if (sessionTheme === 'dark' || sessionTheme === 'light') {
          document.documentElement.setAttribute('data-theme', sessionTheme);
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
